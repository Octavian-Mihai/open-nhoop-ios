<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <clipPath id="screen2"><rect x="0" y="0" width="390" height="844" rx="44"/></clipPath>
  </defs>
  <rect x="0" y="0" width="390" height="844" rx="44" fill="#0B0B0F"/>
  <g clip-path="url(#screen2)">
    <text x="24" y="34" fill="#FFFFFF" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(330,22)" fill="#FFFFFF">
      <rect x="0" y="2" width="18" height="10" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="1.5" y="3.5" width="13" height="7" rx="1.5" fill="#FFFFFF"/>
      <rect x="19" y="4.5" width="1.6" height="5" rx="0.8" fill="#FFFFFF"/>
    </g>

    <text x="24" y="88" fill="#FFFFFF" font-size="30" font-weight="800">Sleep</text>

    <!-- headline -->
    <text x="24" y="126" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">TIME ASLEEP</text>
    <text x="24" y="172" fill="#FFFFFF" font-size="44" font-weight="800">7h 42m</text>
    <text x="24" y="196" fill="#8A8F98" font-size="13">92% sleep efficiency · 11:12 PM – 7:04 AM</text>

    <!-- hypnogram -->
    <rect x="24" y="216" width="342" height="72" rx="14" fill="#16171C"/>
    <g transform="translate(40,232)">
      <!-- stage lanes: wake(top), rem, light, deep(bottom) as a simplified hypnogram -->
      <rect x="0"   y="30" width="18"  height="10" rx="2" fill="#6E727E"/>
      <rect x="20"  y="8"  width="34"  height="10" rx="2" fill="#00C4B4"/>
      <rect x="56"  y="18" width="60"  height="10" rx="2" fill="#4A90D9"/>
      <rect x="118" y="38" width="46"  height="10" rx="2" fill="#1A4FBF"/>
      <rect x="166" y="18" width="40"  height="10" rx="2" fill="#4A90D9"/>
      <rect x="208" y="8"  width="30"  height="10" rx="2" fill="#00C4B4"/>
      <rect x="240" y="38" width="52"  height="10" rx="2" fill="#1A4FBF"/>
      <rect x="294" y="18" width="20"  height="10" rx="2" fill="#4A90D9"/>
    </g>

    <!-- stage breakdown -->
    <rect x="24" y="304" width="342" height="132" rx="18" fill="#16171C"/>
    <text x="44" y="330" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">SLEEP STAGES</text>

    <circle cx="46" cy="356" r="5" fill="#1A4FBF"/>
    <text x="58" y="360" fill="#FFFFFF" font-size="13" font-weight="600">Deep</text>
    <text x="330" y="360" fill="#8A8F98" font-size="13" text-anchor="end">1h 24m · 18%</text>

    <circle cx="46" cy="382" r="5" fill="#00C4B4"/>
    <text x="58" y="386" fill="#FFFFFF" font-size="13" font-weight="600">REM</text>
    <text x="330" y="386" fill="#8A8F98" font-size="13" text-anchor="end">1h 51m · 24%</text>

    <circle cx="46" cy="408" r="5" fill="#4A90D9"/>
    <text x="58" y="412" fill="#FFFFFF" font-size="13" font-weight="600">Light</text>
    <text x="330" y="412" fill="#8A8F98" font-size="13" text-anchor="end">4h 09m · 54%</text>

    <circle cx="46" cy="422" r="0" fill="none"/>
    <text x="58" y="434" fill="#6E727E" font-size="13" font-weight="600">Awake</text>
    <text x="330" y="434" fill="#8A8F98" font-size="13" text-anchor="end">18m · 4%</text>

    <!-- in-sleep signals -->
    <rect x="24" y="448" width="164" height="88" rx="18" fill="#16171C"/>
    <text x="44" y="476" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">AVG SpO2</text>
    <text x="44" y="512" fill="#FFFFFF" font-size="28" font-weight="600">97%</text>

    <rect x="202" y="448" width="164" height="88" rx="18" fill="#16171C"/>
    <text x="222" y="476" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">SKIN TEMP</text>
    <text x="222" y="512" fill="#FFFFFF" font-size="28" font-weight="600">33.4°C</text>

    <!-- 7-night chart -->
    <rect x="24" y="548" width="342" height="120" rx="18" fill="#16171C"/>
    <text x="44" y="574" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">7-NIGHT SLEEP</text>
    <g transform="translate(44,588)">
      <rect x="0"   y="40" width="24" height="30" rx="4" fill="#7B61FF" opacity="0.55"/>
      <rect x="34"  y="20" width="24" height="50" rx="4" fill="#7B61FF" opacity="0.7"/>
      <rect x="68"  y="30" width="24" height="40" rx="4" fill="#7B61FF" opacity="0.6"/>
      <rect x="102" y="10" width="24" height="60" rx="4" fill="#7B61FF"/>
      <rect x="136" y="25" width="24" height="45" rx="4" fill="#7B61FF" opacity="0.65"/>
      <rect x="170" y="15" width="24" height="55" rx="4" fill="#7B61FF" opacity="0.85"/>
      <rect x="204" y="5"  width="24" height="65" rx="4" fill="#7B61FF"/>
      <text x="12"  y="86" fill="#8A8F98" font-size="10" text-anchor="middle">M</text>
      <text x="46"  y="86" fill="#8A8F98" font-size="10" text-anchor="middle">T</text>
      <text x="80"  y="86" fill="#8A8F98" font-size="10" text-anchor="middle">W</text>
      <text x="114" y="86" fill="#8A8F98" font-size="10" text-anchor="middle">T</text>
      <text x="148" y="86" fill="#8A8F98" font-size="10" text-anchor="middle">F</text>
      <text x="182" y="86" fill="#8A8F98" font-size="10" text-anchor="middle">S</text>
      <text x="216" y="86" fill="#8A8F98" font-size="10" text-anchor="middle">S</text>
    </g>

    <!-- smart alarm -->
    <rect x="24" y="684" width="342" height="72" rx="18" fill="#16171C"/>
    <text x="44" y="712" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">SMART ALARM</text>
    <text x="44" y="738" fill="#FFFFFF" font-size="16" font-weight="600">Wake alarm · 7:00 AM</text>

    <!-- tab bar -->
    <rect x="0" y="800" width="390" height="44" fill="#111218"/>
    <line x1="0" y1="800" x2="390" y2="800" stroke="#2A2C33" stroke-width="1"/>
    <g font-size="10" font-weight="600" text-anchor="middle">
      <text x="39" y="826" fill="#8A8F98">Today</text>
      <text x="117" y="826" fill="#FFFFFF">Sleep</text>
      <text x="195" y="826" fill="#8A8F98">Trends</text>
      <text x="273" y="826" fill="#8A8F98">Workouts</text>
      <text x="351" y="826" fill="#8A8F98">Device</text>
    </g>
  </g>
</svg>
