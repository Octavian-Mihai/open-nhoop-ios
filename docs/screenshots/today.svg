<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <clipPath id="screen"><rect x="0" y="0" width="390" height="844" rx="44"/></clipPath>
  </defs>
  <rect x="0" y="0" width="390" height="844" rx="44" fill="#0B0B0F"/>
  <g clip-path="url(#screen)">
    <!-- status bar -->
    <text x="24" y="34" fill="#FFFFFF" font-size="15" font-weight="600">9:41</text>
    <g transform="translate(330,22)" fill="#FFFFFF">
      <rect x="0" y="2" width="18" height="10" rx="2.5" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <rect x="1.5" y="3.5" width="13" height="7" rx="1.5" fill="#FFFFFF"/>
      <rect x="19" y="4.5" width="1.6" height="5" rx="0.8" fill="#FFFFFF"/>
    </g>

    <!-- header -->
    <text x="24" y="88" fill="#FFFFFF" font-size="30" font-weight="800" font-family="-apple-system,Helvetica,Arial,sans-serif">Today</text>

    <!-- recovery ring -->
    <g transform="translate(195,196)">
      <circle r="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="16"/>
      <circle r="100" fill="none" stroke="#16EC06" stroke-width="16" stroke-linecap="round"
              stroke-dasharray="628" stroke-dashoffset="82" transform="rotate(-90)"/>
      <text x="0" y="8" text-anchor="middle" fill="#FFFFFF" font-size="56" font-weight="900" font-family="-apple-system,Helvetica,Arial,sans-serif">87%</text>
      <text x="0" y="34" text-anchor="middle" fill="#8A8F98" font-size="12" font-weight="700" letter-spacing="1.5">RECOVERY</text>
    </g>

    <!-- strain card -->
    <rect x="24" y="332" width="342" height="88" rx="18" fill="#16171C"/>
    <text x="44" y="360" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">DAY STRAIN</text>
    <text x="44" y="398" fill="#0093E7" font-size="36" font-weight="700" font-family="-apple-system,Helvetica,Arial,sans-serif">12.4</text>
    <text x="112" y="398" fill="#8A8F98" font-size="15" font-weight="500">/ 21</text>

    <!-- sleep card -->
    <rect x="24" y="432" width="342" height="88" rx="18" fill="#16171C"/>
    <text x="44" y="460" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">LAST NIGHT</text>
    <text x="44" y="498" fill="#FFFFFF" font-size="36" font-weight="700" font-family="-apple-system,Helvetica,Arial,sans-serif">7h 42m</text>

    <!-- HRV + RHR row -->
    <rect x="24" y="532" width="164" height="88" rx="18" fill="#16171C"/>
    <text x="44" y="560" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">HRV</text>
    <text x="44" y="596" fill="#16EC06" font-size="28" font-weight="600" font-family="-apple-system,Helvetica,Arial,sans-serif">68</text>
    <text x="78" y="596" fill="#8A8F98" font-size="15" font-weight="500">ms</text>

    <rect x="202" y="532" width="164" height="88" rx="18" fill="#16171C"/>
    <text x="222" y="560" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">RESTING HR</text>
    <text x="222" y="596" fill="#FFFFFF" font-size="28" font-weight="600" font-family="-apple-system,Helvetica,Arial,sans-serif">52</text>
    <text x="254" y="596" fill="#8A8F98" font-size="15" font-weight="500">bpm</text>

    <!-- steps card -->
    <rect x="24" y="632" width="342" height="88" rx="18" fill="#16171C"/>
    <text x="44" y="660" fill="#8A8F98" font-size="11" font-weight="600" letter-spacing="1.2">STEPS</text>
    <text x="44" y="698" fill="#0093E7" font-size="36" font-weight="700" font-family="-apple-system,Helvetica,Arial,sans-serif">8,432</text>

    <!-- live chips -->
    <rect x="24" y="736" width="118" height="30" rx="15" fill="#1F2128"/>
    <text x="40" y="756" fill="#FF0026" font-size="12" font-weight="700">♥</text>
    <text x="56" y="756" fill="#FFFFFF" font-size="13" font-weight="700">64 BPM LIVE</text>

    <rect x="150" y="736" width="64" height="30" rx="15" fill="#1F2128"/>
    <text x="164" y="756" fill="#16EC06" font-size="12" font-weight="700">⚡</text>
    <text x="180" y="756" fill="#FFFFFF" font-size="13" font-weight="700">82%</text>

    <text x="24" y="792" fill="#8A8F98" font-size="12">Updated just now</text>

    <!-- tab bar -->
    <rect x="0" y="800" width="390" height="44" fill="#111218"/>
    <line x1="0" y1="800" x2="390" y2="800" stroke="#2A2C33" stroke-width="1"/>
    <g font-size="10" font-weight="600" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif">
      <text x="39" y="826" fill="#FFFFFF">Today</text>
      <text x="117" y="826" fill="#8A8F98">Sleep</text>
      <text x="195" y="826" fill="#8A8F98">Trends</text>
      <text x="273" y="826" fill="#8A8F98">Workouts</text>
      <text x="351" y="826" fill="#8A8F98">Device</text>
    </g>
  </g>
</svg>
